name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Wrapper resmi dipakai lewat ./gradlew. Sebelumnya file
      # gradle/wrapper/gradle-wrapper.jar berisi halaman "404: Not Found"
      # (14 byte) sehingga wrapper tidak bisa jalan sama sekali.
      - name: Cek wrapper Gradle
        run: |
          test -x ./gradlew || { echo "gradlew tidak executable"; exit 1; }
          ./gradlew --version

      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v -keystore app/debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -deststoretype pkcs12

      # assembleDebug sudah menandatangani APK dengan debug keystore secara
      # otomatis. Langkah jarsigner manual sebelumnya menimpa hasil itu dan
      # pernah jadi sumber kegagalan; sekarang tidak diperlukan lagi.
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verifikasi APK terbentuk
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "APK tidak ditemukan di $APK"; exit 1; }
          ls -la "$APK"
          # Cek isi APK pakai python3 (zipfile) — unzip tidak selalu tersedia
          # di runner, dan ketergantungan itu pernah membuat step ini gagal.
          python3 - "$APK" <<'PY'
          import sys, zipfile
          apk = sys.argv[1]
          z = zipfile.ZipFile(apk)
          names = z.namelist()
          assert "AndroidManifest.xml" in names, "bukan APK valid: AndroidManifest.xml tidak ada"
          assert "classes.dex" in names, "bukan APK valid: classes.dex tidak ada"
          sig = [n for n in names if n.startswith("META-INF/") and
                 (n.endswith(".RSA") or n.endswith(".DSA") or n.endswith(".EC") or n == "META-INF/CERT.SF")]
          assert sig, "APK tidak tertandatangani (tidak ada blok tanda tangan di META-INF)"
          print("APK valid:", len(names), "entri; tanda tangan:", sig)
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ssh-client-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
