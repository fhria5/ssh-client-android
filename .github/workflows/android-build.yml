name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Wrapper resmi dipakai lewat ./gradlew. Sebelumnya file
      # gradle/wrapper/gradle-wrapper.jar berisi halaman "404: Not Found"
      # (14 byte) sehingga wrapper tidak bisa jalan sama sekali.
      - name: Cek wrapper Gradle
        run: |
          test -x ./gradlew || { echo "gradlew tidak executable"; exit 1; }
          ./gradlew --version

      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v -keystore app/debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -deststoretype pkcs12

      # assembleDebug sudah menandatangani APK dengan debug keystore secara
      # otomatis. Langkah jarsigner manual sebelumnya menimpa hasil itu dan
      # pernah jadi sumber kegagalan; sekarang tidak diperlukan lagi.
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verifikasi APK terbentuk
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "APK tidak ditemukan di $APK"; exit 1; }
          ls -la "$APK"

          # Tampilkan isi APK lebih dulu supaya kalau ada masalah, log-nya
          # langsung memberi tahu apa yang sebenarnya ada di dalamnya.
          python3 - "$APK" <<'PY'
          import sys, zipfile
          apk = sys.argv[1]
          names = zipfile.ZipFile(apk).namelist()
          print("total entri:", len(names))
          print("META-INF:", [n for n in names if n.startswith("META-INF/")])
          print("dex:", [n for n in names if n.endswith(".dex")])
          assert "AndroidManifest.xml" in names, "bukan APK: AndroidManifest.xml tidak ada"
          assert "classes.dex" in names, "bukan APK: classes.dex tidak ada"
          print("struktur APK ok")
          PY

          # Verifikasi tanda tangan pakai apksigner dari build-tools (otoritatif,
          # menangani skema v1/v2/v3). APK debug yang ditandatangani AGP modern
          # hanya punya blok tanda tangan v2 yang TIDAK berupa entri META-INF,
          # jadi memeriksa entri zip saja bisa salah lapor.
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f 2>/dev/null | sort | tail -1)
          if [ -n "$APKSIGNER" ]; then
            echo "memakai $APKSIGNER"
            "$APKSIGNER" verify --verbose "$APK"
          else
            echo "apksigner tidak ditemukan; lewati verifikasi tanda tangan"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ssh-client-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
